<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - Zepra</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="theme.css" />
  <script src="theme.js"></script>
</head>
<body class="cyber-grid">
  <div class="login-container glass-morphism neon-glow">
    <div id="headerWrap" class="header-video">
      <video id="headerVideo" autoplay loop muted src="src/media/key.webm"></video>
    </div>
    <div class="logo text-center">
      <h1 class="neon-text-pulsating" style="text-align:center; margin:10px 0 20px;">ZEPRA</h1>
      <p class="typing-animation" style="text-align:center; font-size:0.9rem; margin-bottom:20px;">Advanced Identity Management System</p>
    </div>
    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="Email" />
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Password" />
    <button id="loginBtn" class="cyber-button" style="width:100%; margin-top:10px; padding:10px;">INITIALIZE SESSION</button>
    <div id="loginError" style="margin-top:12px; text-align:center; min-height:20px; font-size:0.9rem;"></div>
  </div>
  <script src="login.js"></script>
</body>
</html>
