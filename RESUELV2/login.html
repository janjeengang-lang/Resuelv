<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Zepra Login</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/framer-motion@10.16.2/dist/framer-motion.umd.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin:0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    @keyframes shine { 0% { transform: translateX(-100%) skewX(-20deg); } 100% { transform: translateX(200%) skewX(-20deg); } }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-black to-gray-900 min-h-screen flex items-center justify-center overflow-hidden">
  <div id="root"></div>
  <script src="login.js"></script>
  <script type="text/babel" data-presets="typescript,react">
    const { useState } = React;
    const { motion, AnimatePresence } = window.framerMotion;

    interface ZepraLoginModalProps {
      isOpen: boolean;
      onClose: () => void;
      hasSessionExpired?: boolean;
    }

    const particles = Array.from({ length: 20 }).map((_, i) => (
      <motion.span
        key={i}
        className="absolute w-1 h-1 bg-green-400 rounded-full"
        style={{ top: `${Math.random() * 100}%`, left: `${Math.random() * 100}%` }}
        animate={{ y: [0, -10, 0], x: [0, 10, 0] }}
        transition={{ duration: 5 + Math.random() * 5, repeat: Infinity, repeatType: 'mirror' }}
      />
    ));

    const ZepraLoginModal: React.FC<ZepraLoginModalProps> = ({ isOpen, onClose, hasSessionExpired }) => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [isLoading, setIsLoading] = useState(false);
      const [error, setError] = useState<string | null>(null);

      const handleLogin = async () => {
        setIsLoading(true);
        setError(null);
        const res = await window.performLogin(email, password);
        setIsLoading(false);
        if (!res.success) setError(res.message);
      };

      return (
        <AnimatePresence>
          {isOpen && (
            <motion.div
              className="fixed inset-0 flex items-center justify-center bg-black/60 backdrop-blur-sm"
              initial={{ opacity: 0 }}
              animate={{ opacity: 1 }}
              exit={{ opacity: 0 }}
            >
              <div className="absolute inset-0 overflow-hidden -z-10">
                {particles}
              </div>
              <motion.div
                initial={{ opacity: 0, y: 50, scale: 0.9 }}
                animate={{ opacity: 1, y: 0, scale: 1 }}
                transition={{ type: 'spring', stiffness: 120, damping: 15 }}
                className="w-full max-w-sm p-8 rounded-3xl bg-gradient-to-br from-gray-900 via-black to-gray-900 text-white shadow-[0_0_25px_#4ade80]"
              >
                <motion.div
                  className="flex flex-col items-center"
                  initial="hidden"
                  animate="visible"
                  variants={{ visible: { transition: { staggerChildren: 0.15 } } }}
                >
                  <motion.div
                    variants={{ hidden: { opacity: 0, y: -10 }, visible: { opacity: 1, y: 0 } }}
                    className="w-12 h-12 mb-2 flex items-center justify-center rounded-full bg-green-500/10 text-green-400 shadow-[0_0_10px_#4ade80]"
                    animate={{ rotate: 360 }}
                    transition={{ repeat: Infinity, duration: 4, ease: 'linear' }}
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" className="w-6 h-6">
                      <path d="M13 3L4 14h7l-1 7 9-11h-7z" />
                    </svg>
                  </motion.div>
                  <motion.h1
                    variants={{ hidden: { opacity: 0, y: -10 }, visible: { opacity: 1, y: 0 } }}
                    className="text-2xl font-semibold text-green-400 drop-shadow-[0_0_6px_#4ade80]"
                  >
                    Zepra
                  </motion.h1>
                  <motion.div
                    variants={{ hidden: { scaleX: 0 }, visible: { scaleX: 1 } }}
                    className="h-0.5 w-24 bg-green-500 rounded-full mt-2"
                  />
                  <motion.p
                    variants={{ hidden: { opacity: 0, y: 10 }, visible: { opacity: 1, y: 0 } }}
                    className="text-xs text-green-200 mt-2"
                  >
                    Advanced Chrome Extension Suite
                  </motion.p>
                </motion.div>

                {hasSessionExpired && (
                  <motion.div
                    initial={{ opacity: 0, y: -10 }}
                    animate={{ opacity: 1, y: 0 }}
                    className="flex items-center gap-2 p-3 mt-6 rounded-lg bg-red-500/10 border border-red-500 text-red-400 shadow-[0_0_10px_#ef4444]"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-5 h-5 animate-pulse">
                      <circle cx="12" cy="12" r="10" />
                      <line x1="12" y1="8" x2="12" y2="12" />
                      <line x1="12" y1="16" x2="12.01" y2="16" />
                    </svg>
                    <span className="text-xs">Your session has expired. Please log in again to continue.</span>
                  </motion.div>
                )}

                <div className="mt-6 space-y-4">
                  <div className="relative">
                    <input
                      type="email"
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      placeholder="Enter your email"
                      className="w-full bg-transparent border border-green-500/30 rounded-xl py-3 pl-10 pr-10 text-sm placeholder-gray-500 focus:outline-none focus:border-green-400 focus:shadow-[0_0_10px_#4ade80]"
                    />
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" className="absolute left-3 top-3.5 w-5 h-5 text-green-400">
                      <rect x="3" y="5" width="18" height="14" rx="2" />
                      <polyline points="3 5 12 13 21 5" />
                    </svg>
                    {email && (
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="absolute right-3 top-3.5 w-5 h-5 text-green-400">
                        <polyline points="20 6 9 17 4 12" />
                      </svg>
                    )}
                  </div>
                  <div className="relative">
                    <input
                      type={showPassword ? 'text' : 'password'}
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      placeholder="Enter your password"
                      className="w-full bg-transparent border border-green-500/30 rounded-xl py-3 pl-10 pr-10 text-sm placeholder-gray-500 focus:outline-none focus:border-green-400 focus:shadow-[0_0_10px_#4ade80]"
                    />
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" className="absolute left-3 top-3.5 w-5 h-5 text-green-400">
                      <rect x="3" y="11" width="18" height="11" rx="2" />
                      <path d="M7 11V7a5 5 0 0110 0v4" />
                    </svg>
                    <button
                      type="button"
                      onClick={() => setShowPassword(!showPassword)}
                      className="absolute right-3 top-3.5 text-green-400"
                    >
                      {showPassword ? (
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" className="w-5 h-5">
                          <path d="M17.94 17.94A10.94 10.94 0 0112 19c-5.05 0-9.14-3.3-10.63-7.9a1.1 1.1 0 010-.8A11.03 11.03 0 017.86 3.52M9.9 9.9a3 3 0 104.24 4.24" />
                          <path d="M1 1l22 22" />
                        </svg>
                      ) : (
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" className="w-5 h-5">
                          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                          <circle cx="12" cy="12" r="3" />
                        </svg>
                      )}
                    </button>
                  </div>
                </div>

                {error && <p className="mt-4 text-center text-sm text-red-400">{error}</p>}

                <button
                  onClick={handleLogin}
                  disabled={isLoading}
                  className="w-full py-4 rounded-2xl transition-all duration-300 relative overflow-hidden flex items-center justify-center mt-6 bg-green-500 text-black font-semibold shadow-[0_0_15px_#4ade80] hover:scale-105 hover:-translate-y-0.5 disabled:opacity-50"
                >
                  <span className={`relative z-10 transition-opacity ${isLoading ? 'opacity-0' : 'opacity-100'}`}>Access Zepra</span>
                  {isLoading && <span className="absolute z-10 animate-pulse">Connecting to Zepra...</span>}
                  <span className="absolute inset-0 overflow-hidden">
                    <span className="absolute inset-0 w-1/3 bg-white/20 -skew-x-12 animate-[shine_2s_linear_infinite]"></span>
                  </span>
                </button>

                <div className="mt-8 text-xs text-green-400 flex items-center justify-center gap-2">
                  <span>Powered by Advanced AI • Secure & Encrypted</span>
                  <span className="flex gap-1">
                    <span className="w-1 h-1 rounded-full bg-green-400 animate-pulse"></span>
                    <span className="w-1 h-1 rounded-full bg-green-400 animate-pulse [animation-delay:200ms]"></span>
                    <span className="w-1 h-1 rounded-full bg-green-400 animate-pulse [animation-delay:400ms]"></span>
                  </span>
                </div>
              </motion.div>
            </motion.div>
          )}
        </AnimatePresence>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ZepraLoginModal isOpen={true} onClose={() => {}} hasSessionExpired={window.__sessionExpired} />
    );
  </script>
</body>
</html>
