<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Zepra Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="video-header">
    <video id="loginVideo" src="videos/key.webm" autoplay loop muted></video>
  </div>
  <div class="page">
    <h1 class="zepra-gradient" style="text-align:center;margin-top:0;">Zepra</h1>
    <input type="email" id="email" placeholder="Email" style="width:100%;padding:8px;margin-top:10px;border-radius:6px;border:1px solid #334155;background:#0b1220;color:var(--fg);" />
    <input type="password" id="password" placeholder="Password" style="width:100%;padding:8px;margin-top:8px;border-radius:6px;border:1px solid #334155;background:#0b1220;color:var(--fg);" />
    <button id="loginBtn" class="btn primary" style="width:100%;margin-top:10px;">Login</button>
    <div id="loginError" style="text-align:center;margin-top:10px;min-height:20px;"></div>
  </div>
  <script src="theme.js"></script>
  <script src="login.js"></script>
</body>
</html>
