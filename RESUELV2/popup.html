<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zepra</title>
    <link rel="stylesheet" href="styles.css">
    <script src="theme.js"></script>
</head>
<body class="popup">
    <video id="bgVideo" autoplay loop muted src="src/media/key.webm"></video>
    <div class="dashboard">
        <header>
            <h1>Zepra</h1>
            <div class="user-info">
                <span id="userEmail"></span>
                <button id="logoutBtn">⎋ Logout</button>
                <span id="sessionTimer">00:00:00</span>
            </div>
        </header>

        <div class="mode-selector">
            <button id="prevBtn" class="mode-nav" title="Previous">‹</button>
            <div class="mode-container">
                <button id="btnOpen" class="icon-btn" title="Open-ended">
                    <span class="icon-btn-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
                            <path d="M14 2v4a2 2 0 0 0 2 2h4" />
                            <path d="M10 9H8" />
                            <path d="M16 13H8" />
                            <path d="M16 17H8" />
                        </svg>
                    </span>
                    <span class="icon-btn-label">Open</span>
                </button>
                <button id="btnMCQ" class="icon-btn" title="MCQ">
                    <span class="icon-btn-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="18" x="3" y="3" rx="2" />
                            <path d="m9 12 2 2 4-4" />
                        </svg>
                    </span>
                    <span class="icon-btn-label">MCQ</span>
                </button>
                <button id="btnScale" class="icon-btn" title="Scale">
                    <span class="icon-btn-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 3v18h18" />
                            <path d="M7 15v4" />
                            <path d="M11 11v8" />
                            <path d="M15 7v12" />
                            <path d="M19 5v14" />
                        </svg>
                    </span>
                    <span class="icon-btn-label">Scale</span>
                </button>
                <button id="btnYesNo" class="icon-btn" title="Yes/No">
                    <span class="icon-btn-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" />
                            <path d="m9 12 2 2 4-4" />
                        </svg>
                    </span>
                    <span class="icon-btn-label">Yes/No</span>
                </button>
                <button id="btnAuto" class="icon-btn" title="Auto">
                    <span class="icon-btn-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 20v2" />
                            <path d="M12 2v2" />
                            <path d="M17 20v2" />
                            <path d="M17 2v2" />
                            <path d="M2 12h2" />
                            <path d="M2 17h2" />
                            <path d="M2 7h2" />
                            <path d="M20 12h2" />
                            <path d="M20 17h2" />
                            <path d="M20 7h2" />
                            <path d="M7 20v2" />
                            <path d="M7 2v2" />
                            <rect x="4" y="4" width="16" height="16" rx="2" />
                            <rect x="8" y="8" width="8" height="8" rx="1" />
                        </svg>
                    </span>
                    <span class="icon-btn-label">Auto</span>
                </button>
                <button id="btnOCR" class="icon-btn" title="OCR" style="display:none;">
                    <span class="icon-btn-icon">📷</span>
                    <span class="icon-btn-label">OCR</span>
                </button>
                <button id="btnTranslate" class="icon-btn" title="Translate" style="display:none;">
                    <span class="icon-btn-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" />
                            <path d="M2 12h20" />
                            <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
                        </svg>
                    </span>
                    <span class="icon-btn-label">Translate</span>
                </button>
            </div>
            <button id="nextBtn" class="mode-nav" title="Next">›</button>
        </div>

        <div class="toolbar">
            <button id="navCustom" class="tool-btn" title="Custom Web">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
                    <path d="M2 12h20" />
                </svg>
            </button>
            <button id="navIdent" class="tool-btn" title="Identities">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
            </button>
            <button id="navOptions" class="tool-btn" title="Options">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
            </button>
        </div>

        <div id="status" class="status"></div>

        <main>
            <div class="preview-section">
                <label for="preview">Preview</label>
                <textarea id="preview" rows="4" readonly placeholder="Generated answer will appear here..."></textarea>
            </div>
            <div class="actions-grid">
                <button id="btnWrite" class="btn primary">Write Here</button>
                <button id="btnCopy" class="btn">Copy</button>
                <button id="btnReset" class="btn danger">Reset Context</button>
            </div>
            <div class="actions-grid second">
                <button id="btnCustomPrompt" class="btn">Use Custom</button>
                <button id="btnUseLastPrompt" class="btn">Use Last</button>
            </div>
        </main>

        <footer>
            <div id="ipInfo" class="network-info">
                <div id="ipInfoText">Loading IP information...</div>
            </div>
            <button id="openActivityLog" class="btn footer-btn">Open Activity Log</button>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
