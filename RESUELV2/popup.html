<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zepra</title>
    <link rel="stylesheet" href="styles.css">
    <script src="theme.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
        }

        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.3;
        }

        .dashboard {
            width: 380px;
            height: 95vh;
            max-height: 700px;
            background-color: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(74, 222, 128, 0.2);
            box-shadow: 0 0 40px rgba(10, 70, 30, 0.5);
            border-radius: 1.5rem;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            gap: 1rem;
            color: #e5e7eb;
        }

        header {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 700;
            color: #4ade80;
            text-shadow: 0 0 10px #4ade80;
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            padding: 4px 8px;
            border-radius: 0.75rem;
            font-size: 0.85rem;
        }

        #sessionTimer {
            color: #facc15;
            font-family: monospace;
        }

        #logoutBtn {
            background: #dc2626;
            border: none;
            color: #fff;
            padding: 4px 8px;
            border-radius: 0.375rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
        }

        .mode-selector {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .mode-nav {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: rgba(0,0,0,0.4);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mode-container {
            display: flex;
            flex: 1;
            justify-content: space-between;
            overflow: hidden;
        }

        .icon-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 10px 0;
            background: rgba(0,0,0,0.2);
            border: none;
            border-radius: 0.75rem;
            color: #4ade80;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: rgba(74, 222, 128, 0.2);
            transform: translateY(-2px);
        }

        .icon-btn.active {
            background: rgba(74, 222, 128, 0.2);
            position: relative;
        }

        .icon-btn.active::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: -2px;
            height: 3px;
            background: #4ade80;
            box-shadow: 0 0 6px #4ade80;
            border-radius: 0 0 4px 4px;
        }

        .icon-btn-icon {
            font-size: 1.5rem;
        }

        .icon-btn-label {
            font-size: 0.75rem;
            color: #e5e7eb;
        }

        .toolbar {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .tool-btn {
            background: none;
            border: none;
            color: #4ade80;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 0.5rem;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: rgba(74, 222, 128, 0.1);
        }

        .status {
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
            min-height: 1.2em;
        }

        main {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .preview-section {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .preview-section label {
            color: #e5e7eb;
            font-size: 0.9rem;
        }

        .preview-section textarea {
            background: transparent;
            border: 1px solid #374151;
            border-radius: 0.5rem;
            padding: 0.5rem;
            color: #fff;
            font-family: monospace;
            resize: vertical;
            min-height: 80px;
        }

        .preview-section textarea:focus {
            outline: none;
            border-color: #4ade80;
            box-shadow: 0 0 8px #4ade80;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }

        .actions-grid.second {
            grid-template-columns: repeat(2, 1fr);
        }

        .btn {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 0.5rem;
            padding: 0.5rem;
            color: #e5e7eb;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
        }

        .btn:hover {
            background: rgba(74, 222, 128, 0.2);
            color: #fff;
        }

        .btn.primary {
            background: #22c55e;
            border-color: #22c55e;
            color: #000;
            font-weight: 600;
        }

        .btn.danger {
            background: #dc2626;
            border-color: #dc2626;
            color: #fff;
        }

        footer {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .network-info {
            background: rgba(0,0,0,0.3);
            border: 1px solid #374151;
            border-radius: 0.5rem;
            padding: 0.5rem;
            font-family: monospace;
            font-size: 0.8rem;
        }

        .footer-btn {
            width: 100%;
        }
    </style>
</head>
<body>
    <video id="bgVideo" autoplay loop muted src="src/media/key.webm"></video>
    <div class="dashboard">
        <header>
            <h1>Zepra</h1>
            <div class="user-info">
                <span id="userEmail"></span>
                <button id="logoutBtn">⎋ Logout</button>
                <span id="sessionTimer">00:00:00</span>
            </div>
        </header>

        <div class="mode-selector">
            <button id="prevBtn" class="mode-nav" title="Previous">‹</button>
            <div class="mode-container">
                <button id="btnOpen" class="icon-btn" title="Open-ended">
                    <span class="icon-btn-icon">📝</span>
                    <span class="icon-btn-label">Open</span>
                </button>
                <button id="btnMCQ" class="icon-btn" title="MCQ">
                    <span class="icon-btn-icon">☑️</span>
                    <span class="icon-btn-label">MCQ</span>
                </button>
                <button id="btnScale" class="icon-btn" title="Scale">
                    <span class="icon-btn-icon">📊</span>
                    <span class="icon-btn-label">Scale</span>
                </button>
                <button id="btnYesNo" class="icon-btn" title="Yes/No">
                    <span class="icon-btn-icon">✅</span>
                    <span class="icon-btn-label">Yes/No</span>
                </button>
                <button id="btnAuto" class="icon-btn" title="Auto">
                    <span class="icon-btn-icon">🤖</span>
                    <span class="icon-btn-label">Auto</span>
                </button>
                <button id="btnOCR" class="icon-btn" title="OCR" style="display:none;">
                    <span class="icon-btn-icon">📷</span>
                    <span class="icon-btn-label">OCR</span>
                </button>
                <button id="btnTranslate" class="icon-btn" title="Translate" style="display:none;">
                    <span class="icon-btn-icon">🌐</span>
                    <span class="icon-btn-label">Translate</span>
                </button>
            </div>
            <button id="nextBtn" class="mode-nav" title="Next">›</button>
        </div>

        <div class="toolbar">
            <button id="navCustom" class="tool-btn" title="Custom Web">🌐</button>
            <button id="navIdent" class="tool-btn" title="Identities">👤</button>
            <button id="navOptions" class="tool-btn" title="Options">⚙️</button>
        </div>

        <div id="status" class="status"></div>

        <main>
            <div class="preview-section">
                <label for="preview">Preview</label>
                <textarea id="preview" rows="4" readonly placeholder="Generated answer will appear here..."></textarea>
            </div>
            <div class="actions-grid">
                <button id="btnWrite" class="btn primary">Write Here</button>
                <button id="btnCopy" class="btn">Copy</button>
                <button id="btnReset" class="btn danger">Reset Context</button>
            </div>
            <div class="actions-grid second">
                <button id="btnCustomPrompt" class="btn">Use Custom</button>
                <button id="btnUseLastPrompt" class="btn">Use Last</button>
            </div>
        </main>

        <footer>
            <div id="ipInfo" class="network-info">
                <div id="ipInfoText">Loading IP information...</div>
            </div>
            <button id="openActivityLog" class="btn footer-btn">Open Activity Log</button>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
