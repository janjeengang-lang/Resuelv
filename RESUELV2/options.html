<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Zepra Options</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="video-header">
    <video src="videos/key.webm" autoplay loop muted></video>
  </div>
  <div class="page" style="max-width:400px;">
    <h2 class="zepra-gradient" style="text-align:center;">Settings</h2>
    <label>Primary neon color: <input type="color" id="primaryColor" /></label>
    <div class="row" style="margin-top:10px;">
      <label style="flex:1;">Answer language</label>
      <input id="answerLang" type="text" style="flex:1;padding:6px;border-radius:6px;border:1px solid #334155;background:#0b1220;color:var(--fg);"/>
    </div>
    <div class="row end" style="margin-top:12px;">
      <button id="save" class="btn primary">Save</button>
    </div>
  </div>
  <script src="theme.js"></script>
  <script src="options.js"></script>
</body>
</html>
