<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Identities</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="video-header">
    <video src="videos/key.webm" autoplay loop muted></video>
  </div>
  <div class="page">
    <h2 class="zepra-gradient" style="text-align:center;">Identities</h2>
    <button id="createAI" class="btn primary" style="margin-bottom:10px;">+ Create with AI</button>
    <div id="cards"></div>
  </div>

  <div id="aiModal">
    <div class="modal-content">
      <h3 class="zepra-gradient">AI Persona Prompt</h3>
      <textarea id="aiPrompt" style="width:100%;height:80px;background:#0b1220;color:var(--fg);border:1px solid #334155;border-radius:6px;"></textarea>
      <div class="row end" style="margin-top:8px;">
        <button id="generate" class="btn primary">Generate</button>
      </div>
    </div>
  </div>

  <script src="theme.js"></script>
  <script src="identities.js"></script>
</body>
</html>
